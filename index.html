<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F7 Fourth Device - Aim Simulator</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --panel-color: #1f2833;
            --accent-color: #45f3ff;
            --text-color: #c5c6c7;
            --target-color: #ff4757;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
        }

        /* Sidebar Panels */
        #sidebar {
            width: 300px;
            background-color: var(--panel-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border-right: 2px solid #2f3e46;
            z-index: 10;
        }

        h1 {
            color: var(--accent-color);
            font-size: 24px;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .subtitle {
            font-size: 12px;
            color: #858585;
            margin-bottom: 25px;
        }

        .menu-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            margin-bottom: 8px;
            color: #fff;
        }

        select, button {
            width: 100%;
            padding: 12px;
            background: #0f1319;
            border: 1px solid #4f5d75;
            color: #fff;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        select:focus, button:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        button.main-btn {
            background: var(--accent-color);
            color: #000;
            font-weight: bold;
            font-size: 16px;
            border: none;
            margin-top: 15px;
        }

        button.main-btn:hover {
            background: #33cbd6;
            box-shadow: 0 0 15px rgba(69, 243, 255, 0.4);
        }

        /* Live Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }

        .stat-box {
            background: #0f1319;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            border: 1px solid #232931;
        }

        .stat-val {
            font-size: 20px;
            font-weight: bold;
            color: var(--accent-color);
            margin-top: 5px;
        }

        /* Simulation Canvas Arena */
        #arena {
            flex-grow: 1;
            position: relative;
            background-image: 
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            cursor: crosshair;
            overflow: hidden;
        }

        /* Target Styles */
        .target {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, var(--target-color) 40%, #b31010 100%);
            border: 2px solid #fff;
            box-shadow: 0 0 12px rgba(255, 71, 87, 0.6);
            transform: translate(-50%, -50%);
            transition: transform 0.1s linear;
        }

        /* Custom Crosshair Dot Option */
        #arena::after {
            content: '';
            position: absolute;
            width: 6px;
            height: 6px;
            background: var(--accent-color);
            border-radius: 50%;
            pointer-events: none;
            display: none; /* Can be handled via CSS if default cursor is hidden */
        }

        /* Overlay Screen for Results / Pause */
        .screen-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 12, 16, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 5;
            backdrop-filter: blur(4px);
        }

        .modal {
            background: var(--panel-color);
            padding: 40px;
            border-radius: 12px;
            border: 1px solid #343a40;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .modal h2 {
            color: var(--accent-color);
            margin-bottom: 20px;
        }

        .modal p {
            margin: 12px 0;
            font-size: 18px;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- Sidebar Configurations -->
    <div id="sidebar">
        <div>
            <h1>F7 Fourth Device</h1>
            <div class="subtitle">Aim Engineering Sandbox</div>

            <div class="menu-group">
                <label for="modeSelect">Training Scenario</label>
                <select id="modeSelect">
                    <option value="static">Static Clicking (Gridshot)</option>
                    <option value="tracking">Precise Tracking</option>
                    <option value="strafe">Dynamic Strafing Targets</option>
                </select>
            </div>

            <div class="menu-group">
                <label for="sizeSelect">Target Size</label>
                <select id="sizeSelect">
                    <option value="40">Large (40px)</option>
                    <option value="25" selected>Medium (25px)</option>
                    <option value="12">Small (12px)</option>
                    <option value="6">Micro (6px)</option>
                </select>
            </div>

            <div class="menu-group">
                <label for="durationSelect">Session Length</label>
                <select id="durationSelect">
                    <option value="30">30 Seconds</option>
                    <option value="60" selected>60 Seconds</option>
                    <option value="120">120 Seconds</option>
                </select>
            </div>

            <button id="startBtn" class="main-btn">LAUNCH SIMULATION</button>
        </div>

        <div>
            <div class="stats-grid">
                <div class="stat-box">
                    <div>Score</div>
                    <div id="scoreVal" class="stat-val">0</div>
                </div>
                <div class="stat-box">
                    <div>Accuracy</div>
                    <div id="accVal" class="stat-val">100%</div>
                </div>
                <div class="stat-box">
                    <div>Time Left</div>
                    <div id="timeVal" class="stat-val">0s</div>
                </div>
                <div class="stat-box">
                    <div>KPS</div>
                    <div id="kpsVal" class="stat-val">0.0</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Gameplay Arena -->
    <div id="arena">
        <!-- Overlay for Welcome/Results -->
        <div id="overlayScreen" class="screen-overlay">
            <div class="modal" id="welcomeModal">
                <h2>Simulation Ready</h2>
                <p>Select your operational parameters on the left sidebar engine panel and click launch.</p>
            </div>
            <div class="modal hidden" id="resultsModal">
                <h2>Performance Assessment</h2>
                <p>Score: <span id="resScore" style="color:var(--accent-color)">0</span></p>
                <p>Accuracy: <span id="resAcc" style="color:var(--accent-color)">0%</span></p>
                <p>Targets Hit: <span id="resHits" style="color:#2ecc71">0</span></p>
                <p>Total Misses: <span id="resMisses" style="color:#e74c3c">0</span></p>
                <button id="retryBtn" class="main-btn" style="margin-top:20px;">RESTART CORE</button>
            </div>
        </div>
    </div>

    <script>
        // State engine setup
        const arena = document.getElementById('arena');
        const startBtn = document.getElementById('startBtn');
        const retryBtn = document.getElementById('retryBtn');
        const modeSelect = document.getElementById('modeSelect');
        const sizeSelect = document.getElementById('sizeSelect');
        const durationSelect = document.getElementById('durationSelect');
        
        // Display metrics
        const scoreVal = document.getElementById('scoreVal');
        const accVal = document.getElementById('accVal');
        const timeVal = document.getElementById('timeVal');
        const kpsVal = document.getElementById('kpsVal');
        
        // Screen overlays
        const overlayScreen = document.getElementById('overlayScreen');
        const welcomeModal = document.getElementById('welcomeModal');
        const resultsModal = document.getElementById('resultsModal');
        const resScore = document.getElementById('resScore');
        const resAcc = document.getElementById('resAcc');
        const resHits = document.getElementById('resHits');
        const resMisses = document.getElementById('resMisses');

        let score = 0;
        let hits = 0;
        let shots = 0;
        let timeLeft = 0;
        let gameInterval = null;
        let trackingInterval = null;
        let isPlaying = false;
        let targetsArray = [];
        let maxTargets = 3;

        // Target Configuration constructor
        class TargetItem {
